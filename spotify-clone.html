<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify-clone</title>
    <style>
        body{
            margin:0;
            background:black;
            color:white;
        }
        nav{
            display:flex;
            justify-content:space-between;
            align-items:center;
            wrap:nowrap;
            padding:10px;
        }
        .features{
            display:flex;
            justify-content:space-evenly;

        }
        .nav-right{
            display:flex;
            justify-content:space-evenly;
            flex-direction:row;
            gap:10px;
        }
        .login{
            border-radius:10px;
            background:black;
            color:white;
        }
            </style>

</head>
<body>
        <nav>
            <div class="logo">forArtists</div>
            <div class="features">
                <div>Get started</div>
                <div>Features</div>
                <div>Resources</div>
                <div>Help</div>
            </div>
            <div class="nav-right"> 
                <div class="login">
                <button type="submit">Log in</button>
            </div>
                <div class="get-access">
                    <button>Get access</button>
                </div>
            </div>
                
            
        </nav>
    
</body>
</html>
