<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute Element</title>
    <style>
        .container{
            width:400px;
            height:400px;
            background:yellow;
            position:absolute;
        }
        .box1{
            background:pink;
        width:300px;
            height:300px;
            position:absolute;
            bottom:100px;
        }
        .box2{
            background:green;
            width:200px;
            height:200px;
            position:absolute;
            bottom:100px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">1</div>
        <div class="box2">2</div>
    </div>
</body>
</html>
