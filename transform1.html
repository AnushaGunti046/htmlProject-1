<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transform</title>
    <style>
        body{
            margin:0;
        }
        .div1{
            width:250px;
            height:250px;
            margin:250px;
            border:5px solid;
            font-size:139px;
            text-align:center;
            background:yellow;
            transform:translateX(30px) scale(1.2) skew(10deg) rotate(20deg);
        }
        </style>
</head>
<body>
    <div class="div1">Hi</div>
</body>
</html>
