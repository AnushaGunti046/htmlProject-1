<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Box</title>
    <style>
    .container{
        display:flex;
        justify-content:space-evenly;
        align-items:flex-end;
        flex-direction:row;
        flex-wrap:wrap;
    }
    .container div{
        width:100px;
        height:100px;;
        border:2px solid green;;
        margin:1px;
        background-color:lightgreen;
        padding:10px;
    }
    </style>
</head>
<body>
    <div class="container">
        <div style="width:150px;height:150px;background:orange;border-color:rgb(255,0,0);flex-shrink:5">1</div>
        <div>2</div>
        <div>3</div>
    </div> 
</body>
</html>
