<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <style>
        .button-p{
            border-radius:20px;
            border-width:0.1px;
            color:silver;
            background:white;
            padding:10px;
        text-align:center;
        font-family:arial;
        }
        .g{
            color:blue;
        }
        .o{
            color:red;
        }
        .h{
            color:rgb(255, 255, 0);
        }
        .l{
            color:green;
        }
        .search{
            margin-left:10px;
            background:white;
            border-color:aliceblue;
            padding:6px;
            cursor:pointer;
        }
        .second-search{
           margin-left:10px;
            background:white;
            border-color:aliceblue;
            padding:6px; 
        }
    </style>
</head>
<body>
    <h1><span class="g">G</span><span class="o">o</span><span class="h">o</span><span class="g">g</span><span class="l">l</span><span class="o">e</span></h1>
    <button class="button-p">Search Google or type a URL</button>
    <br>
    <br>
    <button  class="search" >Google Search</button>
    <button class="second-search">I'M Feeling Lucky</button>
</body>
</html>
