<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix-clone</title>
    <style>
        .navi{
            display:flex;
            justify-content: space-between;
        }
        body{
            background:black;
            line-height:30px;
        }
        .logo{
        text-transform:uppercase;
        color:rgb(255, 166, 0);
        font-weight:900;
        letter-spacing:1.5px;
        font-size:30px;
        }
       
        .box{
            display:flex;
        }
        .info{
            
            align-items:center;
            color:rgb(225, 183, 183);
        }
        .get-start{
            color:white;
            background:rgb(255,100,100);
        }
        .get-start:hover{
            background:rgb(255,150,100);
        }
        
        </style>
</head>
<body>
    <div class="navi">
    <div class="logo">
        netflix
    </div>

    <div class="nav-left">
        <label for="language" name="language">English</label>
        <select id="language" name="language">
            <option value="">English</option>
            <option value="">Telugu</option>
        </select>
    </div>
    </div>

    <div class="info">
    <div class="main">Unlimited movies,shows,and more</div>
    <div class="payment">Starts at ₹149. Cancel at any time.</div>
    <div class="details">Ready to watch? Enter your email to create or restart your membership.</div>


    <div class="box">
        <div class="email">
            
            <input type="email" placeholder="Email address" autocomplte autofocus>
            
        </div>
       
        <div class="get-start">
             
            <button type="submit" placeholder="Get Started">Get Started</button>
            
        </div>
    </div>
    </div>

</body>
</html>
