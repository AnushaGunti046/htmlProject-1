<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>netflix-clone</title>
    <style>
        body{
            background:black;
        }
        nav{
            display:flex;
            flex-direction:row;
            justify-content:space-between;
            align-items:center;
            padding:10px 20px;
        }
        .logo{
            color:red;
            text-transform:uppercase;
            font-weight:500;
            letter-spacing:1.2px;
            font-size:40px;
        }
        .navi-left button{
            background:red;
            color:white;
            border-radius:7px;
            cursor:pointer;
            border:0px;
            padding:12px;
            transition:background 0.5s ease;
        }
        .navi-left select{
             padding:12px;
        }
        .navi-left{
            display:flex;
            flex-direction:row;
            gap:40px;
    
        }
        .navi-left button:hover{
            background:rgb(190, 51, 51);
        }
        .content{
            color:white;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            line-height:40px;
            height:80vh;
        }
        .info{
            font-weight:700;
            font-size:30px;

        }
        .payment{
            font-weight:500;
            font-size:20px;
        }
        .box{
            display:flex;
            gap:10px;
            align-items:center;
        }
        .email input{
            padding:20px;
            border:1px solid rgb(204, 190, 190);
            color:white;
            background:black;
            border-radius:2px;
            flex:1;
            min-width:200px;
        }
        .btn button{
            color:white;
            background:red;
            padding:20px;
            border:none;
            border-radius:10px;
            font-size:20px;
            white-space:nowrap;
            transition:05s ease;
        }
         .btn button:hover{
            background:rgb(209, 58, 58);
            color:white;
            cursor:pointer;

        }

    </style>
</head>
<body>
    <nav>
        <div class="logo">netflix</div>


        <div class="navi-left">
            <select>
                <option value="english" selected>English</option>
                <option value="Hindi">Hindi</option>
            </select>
            <button>Sign In</button>
        </div>
    </nav>



    <div class="content">
        <div class="info">
        Unlimited movies,shows,and more
    </div>
    <div class="payment">
        Starts at ₹149. Cancel at any time.
    </div>
    <div class="membership">
        Ready to watch? Enter your email to create or restart your membership.
    </div>
    <div class="box">
        <div class="email">
            <input type="email" placeholder="Email address" autofocus autocomplete="on" required>

        </div>
        <div class="btn">
            <button>Get Started</button>
        </div>
        </div>
    </div>
</body>
</html>
