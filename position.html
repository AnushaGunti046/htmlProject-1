<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positin element</title>
    <style>
        .container{
            background:gray;
            padding:20px;
            position:static;
        }
        .box1{
            width:100px;
            height:100px;
            background:red;
            position:static;
        }
        .box2{
            width:100px;
            height:100px;
            background:blue;
            position:static;
        }
        .box3{
            width:100px;
            height:100px;
            background:green;
            position:static;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="box1">1</div>
    <div class="box2">2</div>
    <div class="box3">3</div>
</div>
</body>
</html>
