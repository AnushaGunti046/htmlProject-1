<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .container{
            display:grid;
            grid-template-columns:100px;
            grid-template-rows:100px 100px 100px 100px;
            background:yellow;
        }
        .container div{
            border-width:1px;
            border-style:solid;
            border-color:silver;
            display:flex;
            background:green;

            justify-content:center;
            align-items:center;

        }
            </style>
</head>
<body>
    <p>rows and columns</p>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
    </div>
</body>
</html>
