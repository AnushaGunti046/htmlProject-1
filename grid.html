<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        .container{
            display:grid;
            grid-template-columns:repeat(3,150px);
            grid-template-rows:repeat(3,150px);
            color:green;
            grid-row-gap:50px;
            grid-column-gap:50px;
            grid-gap:10px;
            justify-content:space-between;
            align-content:center;

        }
        .container2{
            display:grid;
            grid-template-rows:1fr 1fr 1fr;
            grid-template-columns:1fr 1fr 1fr;
                }
                #box1{
                    grid-column-start:1;
                    grid-column-end:4;
                }
                #box2{
                    grid-row-start:2;
                    grid-row-end:6;
                }
    </style>
</head>
<body>
    <div class="container">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
        <div>7</div>
    <div>8</div>
    <div>9</div>

    </div>
    <div class="container2">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
        <div>7</div>
    <div>8</div>
    <div>9</div>

    </div>

</body>
</html>
