<!DOCTYPE html>
<html lang="en">
<head>

    <title>Span Tags</title>
    <style>
        div{
            background:lightgreen;
            padding:10px;
            box-shadow:5px 5px 0 rgb(202, 234, 202);
            max-width:120px;
        }

</head>
<body>
    <div>
    <h2>
        <span style="color:blue;">G</span>

        <span style="color:green;">l</span>
        <span style="color:red;">e</span>
    </h2>
    </div>
</body>
</html>
