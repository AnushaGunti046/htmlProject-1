<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>campus-connect</title>
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Campus-Connect Login</h1>
        <div class="container">
        <form class="form-class">
            <div class="name">
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter your name" autofocus autocomplete required>
            </div>
            <div class="roll">
            <label for="roll">Roll Number:</label>
            <input type="text" id="roll" placeholder="Enter your Roll Number" autocomplete required>
            </div>
            <input type="submit" class="submit">
        </form>
        </div>
    </body>
</html>
