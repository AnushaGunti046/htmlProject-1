<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    p{
        background:red;
        padding-right:10px;
        padding-left:10px;
        padding-top:10px;
        padding-bottom:10px;
        margin-bottom:50px;
        color:white;
        font-family:arial;
        font-size:14px;
        text-align:center;
        text-decoration:underline;
        width:600px;
        margin-left:100px;
    }
    p:hover{
        background:rgb(255,200,100);
        transition:background 0.1s;
        color:crimson;
    }
    </style>
</head>
<body>
    <p><strong>Shop early for best selection of holiday favourites.</strong></p>
</body>
</html>
