<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relive element</title>
    <style>
        .container{
            display:flex;
            gap:10px;
            background:yellow;
            width:400px;
            height:400px;
        }
        .box1{
            width:100px;
            height:100px;
            background:rgb(255, 0, 120);
            position:relative;
            top:0px;
            left:0px;
        }
        .box1:hover{
            background:rgb(207, 26, 144);
        }
        .box2{
            background:rgb(29, 167, 29);
            width:200px;
            height:200px;
            position:relative;
            left:100px;
        }
        .box2:hover{
            background:rgb(33, 178, 33)
        }
        
    </style>
</head>
<body>
    <div class="container">
    <div class="box1">1</div>
    <div class="box2">2</div>
    </div>
</body>
</html>
